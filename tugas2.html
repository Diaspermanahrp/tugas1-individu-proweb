<!DOCTYPE html>
<html>
<head>
    <title>Form Data Mahasiswa</title>

    <!-- Menghubungkan HTML dengan CSS -->
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <h1>Form Data Mahasiswa</h1>

    <form>

        <!-- Input Text -->
        <label>Nama Lengkap:</label>
        <input type="text" name="nama">

        <br><br>

        <!-- Input Password -->
        <label>Password:</label>
        <input type="password" name="password">

        <br><br>

        <!-- Textarea -->
        <label>Alamat:</label>
        <textarea name="alamat"></textarea>

        <br><br>

        <!-- Radio Button -->
        <label>Jenis Kelamin:</label>
        <br>

        <input type="radio" name="jenis_kelamin" value="Laki-laki">
        Laki-laki

        <input type="radio" name="jenis_kelamin" value="Perempuan">
        Perempuan

        <br><br>

        <!-- Checkbox -->
        <label>Hobi:</label>
        <br>

        <input type="checkbox" name="hobi" value="Menyanyi">
        Menyanyi

        <input type="checkbox" name="hobi" value="Olahraga">
        Olahraga

        <input type="checkbox" name="hobi" value="Gaming">
        Gaming

        <br><br>

        <!-- Select Option -->
        <label>Kelas:</label>

        <select name="kelas">
            <option value="Kom C">Kom C</option>
            <option value="Kom A">Kom A</option>
            <option value="Kom B">Kom B</option>
            <option value="Kom D">Kom D</option>
        </select>

        <br><br>

        <!-- Tombol Submit -->
        <input type="submit" value="Kirim">

    </form>

</body>
</html>
