<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Sederhana</title>
</head>

<body>

    <h2>Program Aritmatika Sederhana</h2>

    <label>Input Bilangan 1</label>
    <input type="number" id="bilangan1">

    <br><br>

    <label>Input Bilangan 2</label>
    <input type="number" id="bilangan2">

    <br><br>

    <!-- Tombol operasi -->
    <button onclick="tambah()">+</button>
    <button onclick="kurang()">-</button>
    <button onclick="kali()">x</button>
    <button onclick="bagi()">/</button>

    <br><br>

    <label>Output</label>
    <input type="text" id="hasil" readonly>


    <script>

        // Fungsi penjumlahan
        function tambah() {
            let bilangan1 = Number(document.getElementById("bilangan1").value);
            let bilangan2 = Number(document.getElementById("bilangan2").value);

            let hasil = bilangan1 + bilangan2;

            document.getElementById("hasil").value = hasil;
        }


        // Fungsi pengurangan
        function kurang() {
            let bilangan1 = Number(document.getElementById("bilangan1").value);
            let bilangan2 = Number(document.getElementById("bilangan2").value);

            let hasil = bilangan1 - bilangan2;

            document.getElementById("hasil").value = hasil;
        }


        // Fungsi perkalian
        function kali() {
            let bilangan1 = Number(document.getElementById("bilangan1").value);
            let bilangan2 = Number(document.getElementById("bilangan2").value);

            let hasil = bilangan1 * bilangan2;

            document.getElementById("hasil").value = hasil;
        }


        // Fungsi pembagian
        function bagi() {
            let bilangan1 = Number(document.getElementById("bilangan1").value);
            let bilangan2 = Number(document.getElementById("bilangan2").value);

            if (bilangan2 == 0) {
                document.getElementById("hasil").value = "Tidak bisa dibagi 0";
            } else {
                let hasil = bilangan1 / bilangan2;

                document.getElementById("hasil").value = hasil;
            }
        }

    </script>

</body>
</html>
